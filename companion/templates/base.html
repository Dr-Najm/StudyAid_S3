<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}StudyAid Companion{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
           background: #F0F5F6; color: #1a1a1a; min-height: 100vh; }

    /* ── Nav ── */
    nav { background: #0B1D3A; padding: 0 1.5em; display: flex;
          align-items: center; gap: 0; }
    nav .brand { color: #fff; font-weight: 700; font-size: 1.05em;
                 padding: 0.75em 1em 0.75em 0; margin-right: 1em;
                 border-right: 1px solid #1e3560; white-space: nowrap; }
    nav a { color: #9BB5CC; text-decoration: none; padding: 0.75em 1em;
            font-size: 0.9em; transition: color 0.15s, background 0.15s; }
    nav a:hover { color: #fff; background: #1e3560; }
    nav a.active { color: #fff; border-bottom: 2px solid #0D7C7C; }

    /* ── Page wrapper ── */
    .page { max-width: 900px; margin: 2em auto; padding: 0 1.2em; }

    /* ── Card ── */
    .card { background: #fff; border-radius: 8px; padding: 1.4em 1.6em;
            margin-bottom: 1.4em; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .card h2 { color: #0B1D3A; font-size: 1.1em; margin-bottom: 1em;
               padding-bottom: 0.5em; border-bottom: 2px solid #0D7C7C; }

    /* ── Forms ── */
    .form-row { display: flex; flex-wrap: wrap; gap: 0.8em; margin-bottom: 0.8em; }
    .form-group { display: flex; flex-direction: column; gap: 0.3em; flex: 1; min-width: 140px; }
    label { font-size: 0.82em; font-weight: 600; color: #5A7080; text-transform: uppercase;
            letter-spacing: 0.03em; }
    input, select, textarea {
      border: 1px solid #B0CACF; border-radius: 5px; padding: 0.45em 0.7em;
      font-size: 0.95em; font-family: inherit; background: #fff;
      transition: border-color 0.15s; }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #0D7C7C; }

    /* ── Buttons ── */
    .btn { display: inline-block; padding: 0.5em 1.2em; border-radius: 5px;
           border: none; cursor: pointer; font-size: 0.9em; font-family: inherit;
           font-weight: 600; text-decoration: none; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #0D7C7C; color: #fff; }
    .btn-danger  { background: #C0392B; color: #fff; }
    .btn-sm { padding: 0.3em 0.8em; font-size: 0.82em; }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 0.2em 0.6em; border-radius: 20px;
             font-size: 0.75em; font-weight: 700; }
    .badge-pending  { background: #FFF3CD; color: #856404; }
    .badge-progress { background: #CCE5FF; color: #004085; }
    .badge-done     { background: #D4EDDA; color: #155724; }

    /* ── Table ── */
    table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
    th { background: #E8F4F4; color: #0B1D3A; font-size: 0.8em;
         text-transform: uppercase; letter-spacing: 0.04em;
         padding: 0.6em 0.8em; text-align: left; }
    td { padding: 0.55em 0.8em; border-bottom: 1px solid #E8F4F4; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #F8FBFB; }

    /* ── Flash messages ── */
    .flash { padding: 0.7em 1em; border-radius: 5px; margin-bottom: 1em;
             font-size: 0.9em; }
    .flash-ok  { background: #D4EDDA; color: #155724; border: 1px solid #C3E6CB; }
    .flash-err { background: #F8D7DA; color: #721C24; border: 1px solid #F5C6CB; }

    footer { text-align: center; padding: 2em 0 1em;
             color: #9BB5CC; font-size: 0.8em; }
  </style>
</head>
<body>
  <nav>
    <div class="brand">📚 StudyAid</div>
    <a href="/student/" class="{% if active=='student' %}active{% endif %}">Pelajar</a>
    <a href="/student/live" class="{% if active=='live' %}active{% endif %}"
       style="{% if active=='live' %}{% endif %}">
      <span id="nav-live-dot" style="display:inline-block;width:8px;height:8px;
            border-radius:50%;background:#9BB5CC;margin-right:4px;
            vertical-align:middle"></span>Sesi Langsung
    </a>
    <a href="/student/plan" class="{% if active=='plan' %}active{% endif %}">Perancangan</a>
    <a href="/admin/generate" class="{% if active=='generate' %}active{% endif %}">Jana Kuiz</a>
    <a href="/teacher/" class="{% if active=='teacher' %}active{% endif %}">Guru</a>
  </nav>
  <div class="page">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
  <footer>StudyAid v9 — SMK Gudang Rasau</footer>
</body>
</html>
