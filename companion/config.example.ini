; ============================================================
;  StudyAid Companion App - Configuration Template
; ============================================================
;  Copy this file to "config.ini" and fill in your Gemini API key.
;  config.ini is gitignored so your key never gets committed.
; ============================================================

[server]
; 0.0.0.0 means accept connections from any network interface,
; including the WiFi hotspot the StudyAid device connects to.
; Change to 127.0.0.1 to restrict to localhost only.
host = 0.0.0.0
port = 5000
debug = true

[gemini]
; Get a key at https://aistudio.google.com/app/apikey
api_key = YOUR_GEMINI_API_KEY_HERE
; Use gemini-1.5-flash for cheap/fast quiz generation.
model = gemini-1.5-flash

[demo]
; If true, seed 8 SPM subjects and 2 demo students (Ali, Siti)
; on first run. Has no effect once the database is populated.
seed_demo_data = true
